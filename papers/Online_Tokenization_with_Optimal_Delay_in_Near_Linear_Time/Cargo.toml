[package]
name = "hiriluk"
version.workspace = true
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "Incremental BPE tokenization for all prefixes"
readme = "README.md"
exclude = [
    "release-plz.toml",
    ".github",
    "tools",
    "bindings",
    "python",
    "pyproject.toml",
]

[dependencies]
bytes = { version = "1.11.1", default-features = false }
derive_more = { version = "2.1.1", features = ["add", "constructor", "debug", "deref", "display", "from", "into", "into_iterator", "not"] }
rapidhash = { version = "4.4.1", default-features = false, features = ["std"] }
thiserror = { version = "2.0.18", default-features = false }
tinyvec = { version = "1.11.0", default-features = false, features = ["alloc"] }
serde_json = "1.0"
base64 = "0.23"
regex = "1"
fancy-regex = "0.19"
hf-hub = { version = "0.4.3", default-features = false, features = ["ureq"] }
once_cell = "1.18"
rustc-hash = "2"
sha1 = "0.10"
sha2 = "0.11"
bstr = "1"
memchr = "2"
unicode-normalization = "0.1"
regex-automata = { version = "0.4", default-features = false }
ureq = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rand = "0.10.1"
rayon = "1"
tempfile = "3"

[profile.release]
lto = "fat"

[workspace]
members = ["bindings/python"]
default-members = ["."]
resolver = "3"

[workspace.package]
version = "0.1.0"
