dtype: float32
output_dir: ./outputs
log_level: INFO
add_seed: 0

task:
  name: noisy_linear_regression
  n_tasks: 0
  n_data: 0
  n_dims: 2
  n_points: 32
  n_max_points:  32
  batch_size: 8
  data_seed: 101
  task_seed: 102
  noise_seed: 103
  data_scale: 1.0
  task_scale: 1.0
  noise_scale: 0.5
  clip: null
  use_weights: true
  distrib_name: student
  distrib_param: .inf
  fixed_support: true

model:
  name: transformer
  n_points: 32
  n_layer: 2
  n_embd: 2
  n_head: 2
  seed: 100
  use_ln: true
  use_linear_attention: false

training:
  optimizer: adamw_attn
  lr: 1.0e-4
  schedule: triangle
  warmup_steps: 10
  total_steps: 10
  weight_decay: 0.01
  normalize_weights: false

eval:
  n_samples: 2048
  batch_size: 256
  data_seed: 104
  task_seed: 105
  noise_seed: 106
  every: 2
  eval_n_points: 32
  task_centers:
    - 0.0
    - 0.5
    - 1.0
    - 1.5
    - 2.0
    - 2.5
    - 3.0
    - 3.5
    - 4.0

# Hydra settings
hydra:
  mode: MULTIRUN
  run:
    dir: ${output_dir}/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ${output_dir}/multirun/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}
  sweeper:
    params:
      task.distrib_param: inf
      training.weight_decay: 0.01
      training.lr: 1e-3, 1e-4
      add_seed: 1,2,3
