dtype: float32
output_dir: ./outputs
log_level: INFO
add_seed: 0

task:
  name: ornstein_uhlenbeck
  n_tasks: 0
  n_data: 0
  n_dims: 8 
  n_points: 32
  n_max_points: 32
  use_curriculum: false
  batch_size: 512
  data_seed: 101
  task_seed: 102
  noise_seed: 103
  data_scale: 1.0
  task_scale: 1.0
  noise_scale: 0.5
  clip: null
  use_weights: true
  fixed_support: true
  use_weight_sampling: false
  eval_ridge: false
  distrib_name: student
  distrib_param: .inf
  ou_step: 0.8

model:
  name: single_seq_transformer
  n_points: 32
  n_layer: 8
  n_embd: 128
  n_head: 2
  seed: 100
  use_ln: true
  use_linear_attention: false
  n_out: 8

training:
  optimizer: adamw
  lr: 2.0e-3
  schedule: warmup_cosine_decay
  warmup_steps: 100_000
  total_steps: 500_000
  weight_decay: 0.1
  clip_max_norm: null 
  normalize_weights: false

eval:
  n_samples: 2048
  batch_size: 256
  data_seed: 104
  task_seed: 105
  noise_seed: 106
  every: 20_000
  eval_n_points: 32
  task_centers:
    - 0.
    - 0.25
    - 0.5
    - 0.75
    - 1.0
    - 1.25
    - 1.5
    - 1.75
    - 2.0
    - 2.25
    - 2.5
    - 2.75
    - 3.0
    - 3.25
    - 3.5
    - 3.75
    - 4.0

# Hydra settings
hydra:
  mode: MULTIRUN
  run:
    dir: ${output_dir}/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ${output_dir}/multirun/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}
  sweeper:
    params:
      add_seed: 1, 2, 3
      # When launching, do not launch 3 + use_weights true
      task.distrib_param: inf, 3.0, 5.0, 10.0
      training.lr: 1e-3, 2e-3
